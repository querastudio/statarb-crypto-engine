name: Signal Check

# Runs every 15 minutes and triggers the Vercel signal endpoint.
# Vercel Hobby only allows 1 cron/day — this bypasses that limit for free.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  check-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger signal check
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${{ secrets.VERCEL_APP_URL }}/api/cron/signals" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Signal check failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Signal check OK"
